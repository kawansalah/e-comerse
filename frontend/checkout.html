<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Checkout - BAZZAR</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <link rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body class="bg-gray-50 flex flex-col min-h-screen">
        <!-- Header -->
        <header class="bg-white shadow-md">
            <div class="container mx-auto px-4 py-4">
                <div class="flex items-center justify-between">
                    <div class="text-2xl font-bold text-blue-600">
                        <a href="index.html">BAZZAR</a>
                    </div>
                </div>
            </div>
        </header>

        <!-- Progress Indicator -->
        <div class="bg-white border-b">
            <div class="container mx-auto px-4 py-6">
                <div
                    class="flex items-center justify-center gap-4 max-w-xl mx-auto">
                    <div class="flex items-center">
                        <div
                            class="bg-green-500 text-white rounded-full h-10 w-10 flex items-center justify-center font-bold">
                            <i class="fas fa-check"></i>
                        </div>
                        <span class="ml-2 font-medium text-gray-700">Cart</span>
                    </div>
                    <div class="flex-1 h-1 bg-blue-600"></div>
                    <div class="flex items-center">
                        <div
                            class="bg-blue-600 text-white rounded-full h-10 w-10 flex items-center justify-center font-bold">2</div>
                        <span
                            class="ml-2 font-medium text-blue-600">Checkout</span>
                    </div>
                    <div class="flex-1 h-1 bg-gray-300"></div>
                    <div class="flex items-center">
                        <div
                            class="bg-gray-300 text-gray-600 rounded-full h-10 w-10 flex items-center justify-center font-bold">3</div>
                        <span
                            class="ml-2 font-medium text-gray-500">Confirmation</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <main class="container mx-auto px-4 py-8 flex-1">
            <h1 class="text-3xl font-bold mb-8">Checkout</h1>

            <form id="checkoutForm"
                class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <!-- Left Column - Form -->
                <div class="lg:col-span-2 space-y-6">
                    <!-- Customer Information -->
                    <div class="bg-white rounded-lg shadow-md p-6">
                        <h2 class="text-xl font-bold mb-4">Customer
                            Information</h2>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div class="md:col-span-2">
                                <label
                                    class="block text-sm font-medium text-gray-700 mb-2">
                                    Full Name <span
                                        class="text-red-500">*</span>
                                </label>
                                <input
                                    type="text"
                                    id="customerName"
                                    required
                                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                                    placeholder="John Doe">
                                <p
                                    class="error-message text-red-500 text-sm mt-1 hidden"></p>
                            </div>
                            <div>
                                <label
                                    class="block text-sm font-medium text-gray-700 mb-2">
                                    Email <span class="text-red-500">*</span>
                                </label>
                                <input
                                    type="email"
                                    id="email"
                                    required
                                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                                    placeholder="john@example.com">
                                <p
                                    class="error-message text-red-500 text-sm mt-1 hidden"></p>
                            </div>
                            <div>
                                <label
                                    class="block text-sm font-medium text-gray-700 mb-2">
                                    Phone <span class="text-red-500">*</span>
                                </label>
                                <input
                                    type="tel"
                                    id="phone"
                                    required
                                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                                    placeholder="+1 (555) 123-4567">
                                <p
                                    class="error-message text-red-500 text-sm mt-1 hidden"></p>
                            </div>
                        </div>
                    </div>

                    <!-- Shipping Address -->
                    <div class="bg-white rounded-lg shadow-md p-6">
                        <h2 class="text-xl font-bold mb-4">Shipping Address</h2>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div class="md:col-span-2">
                                <label
                                    class="block text-sm font-medium text-gray-700 mb-2">
                                    Address Line 1 <span
                                        class="text-red-500">*</span>
                                </label>
                                <input
                                    type="text"
                                    id="address"
                                    required
                                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                                    placeholder="123 Main Street">
                                <p
                                    class="error-message text-red-500 text-sm mt-1 hidden"></p>
                            </div>
                            <div class="md:col-span-2">
                                <label
                                    class="block text-sm font-medium text-gray-700 mb-2">
                                    Address Line 2 (Optional)
                                </label>
                                <input
                                    type="text"
                                    id="address2"
                                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                                    placeholder="Apartment, suite, etc.">
                            </div>
                            <div>
                                <label
                                    class="block text-sm font-medium text-gray-700 mb-2">
                                    City <span class="text-red-500">*</span>
                                </label>
                                <input
                                    type="text"
                                    id="city"
                                    required
                                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                                    placeholder="New York">
                                <p
                                    class="error-message text-red-500 text-sm mt-1 hidden"></p>
                            </div>
                            <div>
                                <label
                                    class="block text-sm font-medium text-gray-700 mb-2">
                                    State/Province <span
                                        class="text-red-500">*</span>
                                </label>
                                <input
                                    type="text"
                                    id="state"
                                    required
                                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                                    placeholder="NY">
                                <p
                                    class="error-message text-red-500 text-sm mt-1 hidden"></p>
                            </div>
                            <div>
                                <label
                                    class="block text-sm font-medium text-gray-700 mb-2">
                                    Postal Code <span
                                        class="text-red-500">*</span>
                                </label>
                                <input
                                    type="text"
                                    id="postalCode"
                                    required
                                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                                    placeholder="10001">
                                <p
                                    class="error-message text-red-500 text-sm mt-1 hidden"></p>
                            </div>
                            <div>
                                <label
                                    class="block text-sm font-medium text-gray-700 mb-2">
                                    Country <span class="text-red-500">*</span>
                                </label>
                                <input
                                    type="text"
                                    id="country"
                                    required
                                    value="United States"
                                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                                <p
                                    class="error-message text-red-500 text-sm mt-1 hidden"></p>
                            </div>
                        </div>
                    </div>

                    <!-- Payment Method -->
                    <div class="bg-white rounded-lg shadow-md p-6">
                        <h2 class="text-xl font-bold mb-4">Payment Method</h2>
                        <div
                            class="flex items-center p-4 border-2 border-blue-600 rounded-lg bg-blue-50">
                            <input type="radio" id="cod" name="payment"
                                value="cod" checked
                                class="h-4 w-4 text-blue-600">
                            <label for="cod"
                                class="ml-3 flex items-center gap-2">
                                <i
                                    class="fas fa-money-bill-wave text-blue-600"></i>
                                <span class="font-medium">Cash on
                                    Delivery</span>
                            </label>
                        </div>
                    </div>
                </div>

                <!-- Right Column - Order Summary -->
                <div class="lg:sticky lg:top-24 h-fit">
                    <div class="bg-white rounded-lg shadow-md p-6 space-y-4">
                        <h2 class="text-xl font-bold mb-4">Order Summary</h2>

                        <div id="orderItems"
                            class="space-y-3 max-h-60 overflow-y-auto">
                            <!-- Order items will be inserted here -->
                        </div>

                        <div class="border-t pt-4 space-y-2">
                            <div class="flex justify-between text-gray-600">
                                <span>Subtotal</span>
                                <span id="subtotal">$0.00</span>
                            </div>
                            <div class="flex justify-between text-gray-600">
                                <span>Shipping</span>
                                <span id="shipping">$0.00</span>
                            </div>
                            <div class="flex justify-between text-gray-600">
                                <span>Tax (8%)</span>
                                <span id="tax">$0.00</span>
                            </div>
                        </div>

                        <div class="border-t pt-4">
                            <div class="flex justify-between text-xl font-bold">
                                <span>Total</span>
                                <span id="total"
                                    class="text-blue-600">$0.00</span>
                            </div>
                        </div>

                        <button type="submit" id="submitOrderBtn"
                            class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition shadow-md">
                            <span id="btnText">Place Order</span>
                            <span id="btnLoading" class="hidden">
                                <i class="fas fa-spinner fa-spin"></i>
                                Processing...
                            </span>
                        </button>

                        <p class="text-xs text-gray-500 text-center">
                            By placing your order, you agree to our terms and
                            conditions.
                        </p>
                    </div>
                </div>
            </form>
        </main>

        <!-- Footer -->
        <footer class="bg-gray-800 text-white mt-16">
            <div class="container mx-auto px-4 py-8">
                <div class="text-center text-gray-400">
                    <p>&copy; 2025 BAZZAR. All rights reserved.</p>
                </div>
            </div>
        </footer>

        <script src="js/utils.js"></script>
        <script src="js/checkout.js"></script>
    </body>
</html>
